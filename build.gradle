
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.jetbrains.kotlin.android) apply false
    alias(libs.plugins.android.library) apply false
}

def getComputedVersionCode() {
    def envRunNumber = System.getenv("GITHUB_RUN_NUMBER")
    if (envRunNumber != null && !envRunNumber.isEmpty()) {
        try {
            return Integer.parseInt(envRunNumber)
        } catch (Exception ignored) {
        }
    }
    return 100
}

def vCode = getComputedVersionCode()
def major = 0
def minor = (int) (vCode / 10)
def patch = (int) (vCode % 10)
def vName = "${major}.${minor}.${patch}"

ext {
    compileSdkVersion = 35
    targetSdkVersion = 28 

    minSdk = 21
    versionCode = vCode
    versionName = vName
    xVersion = '1.1.0'
    hiddenApiBypass = '4.3'
}
