name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
      - stable
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dynamic versioning
        id: versioning
        run: |
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          MAJOR=0
          MINOR=$(( VERSION_CODE / 10 ))
          PATCH=$(( VERSION_CODE % 10 ))
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ steps.versioning.outputs.version_code }}
        run: ./gradlew assembleRelease

      - name: Find Release APK
        id: find_apk
        run: |
          APK_PATH=$(find ./app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarkVirtualbox-${{ steps.versioning.outputs.version_name }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sark Virtualbox ${{ github.ref_name }}
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
